<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: #fff;
      padding: 15px;
      margin: 20px auto;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 90%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #2c3e50;
      color: white;
    }


    </style>
</head>
<body>

      <h1>Student Management System</h1>

  <div id="output"></div>
    <script>
        // Student Management System (JavaScript - UI Version)
// Displays data directly on the web page (NOT console)

const MAX = 50;
const TOTAL_MARKS = 450;

// Data
let names = [
  "Millan Noor", "Mariam", "Tahira", "Nelofar", "Shaista", "Kiran",
  "Fida", "Fahad", "Sir Ismail", "Fatima", "Hiba", "Haris",
  "Isra", "Ishfaq", "Juniad"
];

let departments = [
  "Computer Science", "Mathematics", "Physics", "Biology", "Chemistry",
  "Mechanical Engineering", "Electrical Engineering", "Civil Engineering",
  "Economics", "History", "Philosophy", "English", "Psychology",
  "Business Administration", "Art"
];

let rollNo = Array.from({ length: MAX }, (_, i) => (i < 15 ? i + 1 : 0));
let marks = Array.from({ length: MAX }, () => Array(8).fill(0));

// Initialize marks
function initializeMarks() {
  for (let i = 0; i < MAX; i++) {
    for (let j = 0; j < 8; j++) {
      marks[i][j] = 350 + i * 2 + j * 10;
    }
  }
}

function semPercentage(m, total) {
  return (m / total) * 100;
}

function semGPA(p) {
  return (p / 100) * 4;
}

// Render all students to page
function displayAll() {
  const container = document.getElementById("output");
  container.innerHTML = "";

  for (let i = 0; i < MAX; i++) {
    if (rollNo[i] !== 0) {
      let totalGPA = 0;

      let html = `
        <div class="card">
          <h3>${names[i]} (Roll No: ${rollNo[i]})</h3>
          <p><strong>Department:</strong> ${departments[i]}</p>
          <table>
            <tr>
              <th>Semester</th>
              <th>Marks</th>
              <th>Percentage</th>
              <th>GPA</th>
            </tr>
      `;

      for (let j = 0; j < 8; j++) {
        const percent = semPercentage(marks[i][j], TOTAL_MARKS);
        const gpa = semGPA(percent);
        totalGPA += gpa;

        html += `
          <tr>
            <td>${j + 1}</td>
            <td>${marks[i][j]}</td>
            <td>${percent.toFixed(2)}%</td>
            <td>${gpa.toFixed(2)}</td>
          </tr>
        `;
      }

      html += `
          </table>
          <p><strong>CGPA:</strong> ${(totalGPA / 8).toFixed(2)}</p>
        </div>
      `;

      container.innerHTML += html;
    }
  }
}

initializeMarks();
displayAll();
    </script>
</body>
</html>
